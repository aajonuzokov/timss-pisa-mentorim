name: Tekshiruv

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      # bun.lock Lovable ichki reyestriga bog'langan, shuning uchun bog'liqliklar npm orqali o'rnatiladi.
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Tiplar
        run: npx tsc --noEmit -p .
      - name: Testlar (javob tekshiruvi, statistika, savollar banki)
        run: bun test tests
